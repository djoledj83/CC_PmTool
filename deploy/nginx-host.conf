# Host-level nginx reverse proxy for the PM Tool (plain HTTP).
#
# One public address, no ports for users:
#   http://<server>/           -> frontend container (127.0.0.1:3000)
#   http://<server>/api/       -> backend container  (127.0.0.1:5000)
#   http://<server>/uploads/   -> backend (signed file downloads)
#   http://<server>/socket.io/ -> backend (WebSocket, live updates)
#
# Install:  sudo cp deploy/nginx-host.conf /etc/nginx/conf.d/pmtool.conf
#           (Debian/Ubuntu: /etc/nginx/sites-available/pmtool + symlink into
#           sites-enabled, and remove the "default" site)
#           sudo nginx -t && sudo systemctl reload nginx
#
# Then in the root .env set BOTH to the same origin, without ports:
#   APP_ORIGIN=http://<server>      API_URL=http://<server>
#   BIND_ADDRESS=127.0.0.1          (containers reachable only via nginx)
# and rebuild the frontend:  docker compose up -d --build
#
# HTTPS later: add a second `server { listen 443 ssl; ... }` with the
# certificate, turn this block into a redirect, set COOKIE_SECURE=true and
# switch the two URLs above to https://. See docs/reverse-proxy.md.

upstream pm_frontend { server 127.0.0.1:3000; }
upstream pm_backend  { server 127.0.0.1:5000; }

server {
    listen 80;
    listen [::]:80;
    server_name _;            # replace with the DNS name once there is one

    # Largest upload the backend accepts is 50 MB (release artefacts).
    client_max_body_size 55m;

    # Shared proxy headers
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- API -----------------------------------------------------------------
    location /api/ {
        proxy_pass http://pm_backend;
        proxy_read_timeout 120s;
    }

    # --- Signed file downloads / avatars ------------------------------------
    location /uploads/ {
        proxy_pass http://pm_backend;
        proxy_buffering off;
    }

    # --- WebSocket (Socket.IO) ----------------------------------------------
    location /socket.io/ {
        proxy_pass http://pm_backend;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;   # keep idle sockets open
        proxy_send_timeout 3600s;
    }

    # --- SPA -----------------------------------------------------------------
    location / {
        proxy_pass http://pm_frontend;
    }
}
