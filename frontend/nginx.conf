# ----------------------------------------------------------------------------
# PM Tool — frontend nginx config (production)
#
# Used by Dockerfile.prod to serve the pre-built Vite bundle. This
# server block:
#   1. Serves the SPA from /usr/share/nginx/html
#   2. Falls back to index.html so React Router deep-links resolve
#   3. Caches /assets/* aggressively (Vite emits content-hashed names)
#   4. Sets Content-Security-Policy + the standard hardening headers
#   5. Has the HSTS hook ready — uncomment ONCE you are behind HTTPS,
#      not before (HSTS over http: is a footgun)
#
# This container speaks plain HTTP on :80. Terminate TLS with an
# external reverse proxy (nginx / Caddy / Cloudflare) — see the
# RELEASE_NOTES "Reverse proxy + HSTS" appendix for a drop-in snippet.
# ----------------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Health probe for compose / external monitoring.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- Caching ----------------------------------------------------------
    # Vite hashes asset filenames (e.g. /assets/index-abc123.js), so
    # they're safe to cache forever — a content change produces a new
    # filename and the HTML index is the only thing that points at the
    # old one.
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Anything else with a static-asset extension (fonts, images at the
    # root, favicons) gets a sensible cache window.
    location ~* \.(?:ico|gif|jpe?g|png|webp|avif|svg|woff2?|ttf|eot|map)$ {
        access_log off;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # --- Security headers -------------------------------------------------
    # Defaults applied to every HTML response below. Asset locations
    # above override Cache-Control but inherit these.
    #
    # IMPORTANT: this value MUST be a single line. nginx does NOT honour
    # a trailing `\` as line-continuation inside a quoted `set` — the
    # backslash + newline end up in the header value, the browser sees
    # directives whose names start with `\`, rejects them, and falls
    # back to `default-src` for everything else (which broke login when
    # connect-src silently disappeared).
    #
    # `default-src 'self'` is the core requirement. Tailwind / Vite
    # inject inline <style> tags at runtime, so we allow 'unsafe-inline'
    # for style-src only. React itself is bundled — it does NOT need
    # 'unsafe-eval' or 'unsafe-inline' for script-src.
    #
    # `connect-src` must include your backend origin + WebSocket. We
    # allow http:/ws: explicitly because the default deployment is
    # plain HTTP (e.g. http://<server-ip>:5000) — drop those two schemes
    # once you're behind HTTPS and use a single explicit origin instead
    # for maximum defence (e.g. `connect-src 'self' https://api.example.com wss://api.example.com`).
    #
    # `img-src` allows data: for inline SVG icons + blob: for the
    # in-app PDF preview. `frame-ancestors 'none'` is what makes
    # X-Frame-Options redundant but we send both for old browsers.
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: http: https:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; media-src 'self' blob:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";

    # HTML / SPA index — no caching (the browser must always re-check
    # so a deploy ships immediately).
    location / {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
        add_header Content-Security-Policy $csp always;
        # --- HSTS ---------------------------------------------------------
        # UNCOMMENT THIS ONLY ONCE EVERY USER REACHES THE APP OVER HTTPS.
        # Once a browser receives this header it will REFUSE plain HTTP to
        # your host for `max-age` seconds — start with a short window
        # (e.g. 600) while you confirm TLS works, then bump to a year.
        #
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        try_files $uri /index.html;
    }
}
